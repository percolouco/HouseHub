<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    # Jamais servir les fichiers/dossiers cachés (.env, .git, .htpasswd…), sauf .well-known
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
